version: 2

models:
  - name: stg_customers
    description: "Cleaned and standardized customer data"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned and standardized order data"
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
