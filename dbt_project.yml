name: 'sample_dbt_project'
version: '1.0.0'
config-version: 2

profile: 'sample_dbt_project'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sample_dbt_project:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  sample_dbt_project:
    +quote_columns: false
